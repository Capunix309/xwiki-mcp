[shared]
# Common host; integration api_path values add each application's context path.
base_url = "https://jira.montefiore.ulg.ac.be"

[tools]
# Write tools remain visible unless explicitly disabled.
expose_write = true
# Destructive tools require explicit enablement in addition to write visibility.
expose_destructive = false

[integrations.xwiki]
enabled = true
api_path = "/xwiki"
default_wiki = "team"
username_env = "XWIKI_TEAM_USERNAME"
password_env = "XWIKI_TEAM_PASSWORD"

[[integrations.xwiki.wikis]]
id = "team"
wiki = "team00xx"
read_only = false

[[integrations.xwiki.wikis]]
id = "global"
wiki = "xwiki"
read_only = true

[[integrations.xwiki.wikis]]
id = "openshift"
wiki = "openshiftcluster"
read_only = true

[[integrations.xwiki.wikis]]
id = "SPEAM"
wiki = "speam"
read_only = true

[integrations.jira]
enabled = true
api_path = ""
username_env = "JIRA_USERNAME"
password_env = "JIRA_PASSWORD"

# Replace this entry with each Jira project the MCP may access.
[[integrations.jira.projects]]
id = "team"
key = "YOUR_PROJECT_KEY"
read_only = false
